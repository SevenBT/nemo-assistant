[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-eval"
version = "0.1.0"
description = "Independent evidence-based evaluation for Nemo"
requires-python = ">=3.12"
dependencies = ["nemo-assistant", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nemo-eval = "nemo_eval.cli:main"

[tool.uv.sources]
nemo-assistant = { path = "..", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
