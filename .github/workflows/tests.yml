name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    # 项目依赖 keyboard / uiautomation / pywin32 等 Windows 专用库，必须用 Windows runner。
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    env:
      # PyQt 测试在无显示器的 CI 上运行，用离屏平台插件。
      QT_QPA_PLATFORM: offscreen
      # litellm import 时会联网拉取价格表，用本地成本表禁用，避免 CI 卡在网络请求。
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --extra desktop --extra dev --frozen

      - name: Run repository checks
        run: uv run python scripts/check_repo.py

      - name: Run tests
        run: uv run pytest -q

  eval-offline:
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install independent evaluation environment
        run: |
          python -m pip install uv
          uv sync --project evals --extra dev --frozen
      - name: Check headless dependency boundary
        run: uv run --project evals --frozen python evals/check_boundaries.py
      - name: Test evaluator and production offline scenarios
        run: |
          uv run --project evals --frozen pytest evals/tests -q
          uv run --project evals --frozen nemo-eval validate --suite core
          uv run --project evals --frozen nemo-eval run --suite core --out artifacts/eval/ci-core
      - name: Upload synthetic evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: |
            artifacts/eval/ci-core/summary.json
            artifacts/eval/ci-core/junit.xml
            artifacts/eval/ci-core/report.md
          retention-days: 14
